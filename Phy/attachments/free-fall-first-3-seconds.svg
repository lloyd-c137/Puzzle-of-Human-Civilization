<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Free fall during the first three seconds</title>
  <desc id="desc">A ball is released from rest and falls farther each second. The diagram marks velocity and cumulative displacement at zero, one, two, and three seconds.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="gravity-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#ffffff"/>
  <text x="48" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Free fall from rest: first 3 seconds</text>
  <text x="48" y="78" font-family="Arial, sans-serif" font-size="17" fill="#4b5563">Assume air resistance is negligible; g = 10 m/s²; downward is positive.</text>

  <line x1="230" y1="132" x2="230" y2="540" stroke="#9ca3af" stroke-width="4"/>
  <line x1="230" y1="540" x2="230" y2="570" stroke="#dc2626" stroke-width="3" marker-end="url(#gravity-arrow)"/>
  <text x="250" y="570" font-family="Arial, sans-serif" font-size="16" fill="#dc2626">downward</text>

  <g font-family="Arial, sans-serif">
    <circle cx="230" cy="132" r="13" fill="#f97316" stroke="#9a3412" stroke-width="3"/>
    <text x="285" y="126" font-size="21" font-weight="700" fill="#111827">t = 0 s</text>
    <text x="285" y="152" font-size="18" fill="#374151">v = 0 m/s</text>
    <text x="285" y="177" font-size="18" fill="#374151">d = 0 m</text>

    <circle cx="230" cy="190" r="13" fill="#f97316" stroke="#9a3412" stroke-width="3"/>
    <text x="285" y="184" font-size="21" font-weight="700" fill="#111827">t = 1 s</text>
    <text x="285" y="210" font-size="18" fill="#374151">v = 10 m/s downward</text>
    <text x="285" y="235" font-size="18" fill="#374151">d = 5 m</text>

    <circle cx="230" cy="310" r="13" fill="#f97316" stroke="#9a3412" stroke-width="3"/>
    <text x="285" y="304" font-size="21" font-weight="700" fill="#111827">t = 2 s</text>
    <text x="285" y="330" font-size="18" fill="#374151">v = 20 m/s downward</text>
    <text x="285" y="355" font-size="18" fill="#374151">d = 20 m</text>

    <circle cx="230" cy="500" r="13" fill="#f97316" stroke="#9a3412" stroke-width="3"/>
    <text x="285" y="494" font-size="21" font-weight="700" fill="#111827">t = 3 s</text>
    <text x="285" y="520" font-size="18" fill="#374151">v = 30 m/s downward</text>
    <text x="285" y="545" font-size="18" fill="#374151">d = 45 m</text>
  </g>

  <g stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)">
    <line x1="170" y1="190" x2="170" y2="218"/>
    <line x1="170" y1="310" x2="170" y2="365"/>
    <line x1="170" y1="500" x2="170" y2="590"/>
  </g>
  <text x="55" y="164" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">velocity arrows grow</text>

  <g stroke="#6b7280" stroke-width="2" stroke-dasharray="6 6">
    <line x1="230" y1="190" x2="800" y2="190"/>
    <line x1="230" y1="310" x2="800" y2="310"/>
    <line x1="230" y1="500" x2="800" y2="500"/>
  </g>

  <rect x="620" y="112" width="290" height="118" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="642" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">What the spacing shows</text>
  <text x="642" y="170" font-family="Arial, sans-serif" font-size="16" fill="#1e40af">Distance each second:</text>
  <text x="642" y="196" font-family="Arial, sans-serif" font-size="16" fill="#1e40af">5 m, then 15 m, then 25 m.</text>
  <text x="642" y="222" font-family="Arial, sans-serif" font-size="16" fill="#1e40af">The object is accelerating.</text>
</svg>
